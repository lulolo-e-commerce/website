<!doctype html>
<!--
  Source for public/og.png, the link preview image (1200x630). After editing, render it with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
    --force-device-scale-factor=1 --window-size=1200,630 --screenshot=public/og.png "file://$PWD/design/og.html"
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --surface:#f5f5f7; --ink:#1d1d1f; --lead:#6e6e73; --rule:#d2d2d7; --accent:#0066cc; --button:#0071e3; --wash:#e8f1fc; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif; color: var(--ink); position: relative; }

  .text { position: absolute; left: 80px; top: 72px; bottom: 64px; width: 600px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 600; font-size: 30px; letter-spacing: .04em; }
  .brand svg { width: 26px; height: 26px; }
  h1 { margin-top: auto; font-size: 72px; line-height: 1.02; letter-spacing: -0.045em; font-weight: 700; }
  h1 span { display: block; }
  h1 .hi { color: var(--button); }
  .offers { margin-top: 30px; display: flex; gap: 8px; }
  .chip { font-size: 18px; padding: 8px 14px; border-radius: 999px; background: var(--surface); color: var(--lead); white-space: nowrap; }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.blue { background: var(--wash); color: var(--accent); }
  .url { margin-top: auto; padding-top: 28px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 24px; color: var(--accent); }

  .canvas { position: absolute; right: 48px; top: 48px; width: 452px; height: 534px; border-radius: 32px;
    background-color: var(--surface);
    background-image: radial-gradient(circle, rgb(0 0 0 / .09) 1px, transparent 1.5px);
    background-size: 22px 22px; overflow: hidden; }
  .glow { position: absolute; left: 50%; top: 50%; width: 420px; height: 420px; transform: translate(-50%,-50%);
    border-radius: 50%; background: radial-gradient(circle, rgb(0 113 227 / .16), transparent 65%); }
  svg.links { position: absolute; inset: 0; }
  .card { position: absolute; background: #fff; border-radius: 16px; box-shadow: 0 1px 0 rgb(0 0 0 / .04), 0 10px 30px rgb(0 0 0 / .08); }
  .tag { position: absolute; font-size: 15px; font-weight: 600; color: var(--lead); letter-spacing: .01em; background: #fff;
    padding: 5px 11px; border-radius: 999px; box-shadow: 0 0 0 1px var(--rule); white-space: nowrap; }
  .tag i { font-style: normal; color: var(--accent); }
  .bar { height: 8px; border-radius: 4px; background: var(--rule); }

  /* website */
  .site { left: 36px; top: 40px; width: 250px; height: 128px; overflow: hidden; }
  .site .chrome { height: 28px; border-bottom: 1px solid #ececef; display: flex; align-items: center; gap: 6px; padding: 0 12px; }
  .site .chrome i { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
  .site .chrome .addr { margin-left: 10px; flex: 1; height: 12px; border-radius: 6px; background: var(--surface); }
  .site .body { padding: 16px; display: grid; grid-template-columns: 1fr 64px; gap: 12px; }
  .site .hero { height: 64px; border-radius: 8px; background: linear-gradient(135deg, #40a9ff, #5e5ce6); }
  .site .lines { display: grid; gap: 9px; align-content: start; }

  /* server */
  .server { left: 150px; top: 222px; width: 170px; height: 140px; }
  .server .row { height: 46.6px; display: flex; align-items: center; padding: 0 16px; gap: 10px; }
  .server .row + .row { border-top: 1px solid #ececef; }
  .server .row .bar { flex: 1; }
  .server .row .bar.s { flex: .4; background: transparent; }
  .server .led { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; }
  .server .led.on { background: var(--button); box-shadow: 0 0 0 4px rgb(0 113 227 / .15); }

  /* engineer */
  .eng { left: 200px; top: 400px; width: 216px; height: 92px; display: flex; align-items: center; gap: 14px; padding: 0 18px; }
  .eng svg { width: 40px; height: 40px; flex: none; fill: none; stroke: var(--ink); stroke-width: 1.6; }
  .eng .lines { flex: 1; display: grid; gap: 10px; }
</style>
</head>
<body>
  <div class="text">
    <div class="brand">
      <svg viewBox="0 0 32 32">
        <path d="M6 6V26H26" fill="none" stroke="#1d1d1f" stroke-width="2"/>
        <g fill="#1d1d1f"><circle cx="6" cy="6" r="3.6"/><circle cx="6" cy="16" r="3.6"/><circle cx="6" cy="26" r="3.6"/><circle cx="16" cy="26" r="3.6"/><circle cx="26" cy="26" r="3.6"/></g>
        <g fill="#d2d2d7"><circle cx="16" cy="6" r="2.4"/><circle cx="16" cy="16" r="2.4"/><circle cx="26" cy="16" r="2.4"/></g>
        <circle cx="26" cy="6" r="3.6" fill="#0066cc"/>
      </svg>
      LULOLO
    </div>
    <h1><span>Your site.</span><span>Your server.</span><span class="hi">Our engineers.</span></h1>
    <div class="offers">
      <span class="chip">Web hosting <b>€2.99</b>/mo</span>
      <span class="chip">VPS <b>€9.99</b>/mo</span>
      <span class="chip blue">Engineers on demand</span>
    </div>
    <div class="url">lulolo.com</div>
  </div>

  <div class="canvas">
    <div class="glow"></div>
    <svg class="links" viewBox="0 0 452 534" fill="none" stroke-width="2" stroke-linecap="round">
      <circle cx="226" cy="280" r="150" stroke="#d2d2d7" stroke-opacity=".6" stroke-width="1"/>
      <circle cx="226" cy="280" r="205" stroke="#d2d2d7" stroke-opacity=".4" stroke-width="1"/>
      <path d="M110 168 V255 H150" stroke="#0071e3"/>
      <path d="M320 292 H372 V400" stroke="#0071e3" stroke-dasharray="1 6"/>
    </svg>

    <div class="card site">
      <div class="chrome"><i></i><i></i><i></i><span class="addr"></span></div>
      <div class="body">
        <div class="hero"></div>
        <div class="lines"><div class="bar"></div><div class="bar" style="width:70%"></div><div class="bar" style="width:85%"></div></div>
      </div>
    </div>
    <span class="tag" style="left:300px; top:56px"><i>●</i> Web hosting</span>

    <div class="card server">
      <div class="row"><span class="bar"></span><span class="bar s"></span><span class="led"></span></div>
      <div class="row"><span class="bar"></span><span class="bar s"></span><span class="led on"></span></div>
      <div class="row"><span class="bar"></span><span class="bar s"></span><span class="led"></span></div>
    </div>
    <span class="tag" style="left:26px; top:330px"><i>●</i> Cloud VPS</span>

    <div class="card eng">
      <svg viewBox="0 0 40 40"><circle cx="20" cy="14" r="7"/><path d="M6 36c1.5-7.5 7-11 14-11s12.5 3.5 14 11"/></svg>
      <div class="lines"><div class="bar"></div><div class="bar" style="width:60%"></div></div>
    </div>
    <span class="tag" style="left:36px; top:432px"><i>●</i> Development</span>
  </div>
</body>
</html>
